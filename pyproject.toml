[project]
name = "lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"

requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.5",
    "pandas>=3.0.5",
    "polars>=1.44.1",
]

[project.scripts]
lab = "lab:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.5",
]
